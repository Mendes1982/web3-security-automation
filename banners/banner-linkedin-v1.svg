<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fundo -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para texto -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Padrão de grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Fundo -->
  <rect width="1500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Grid pattern -->
  <rect width="1500" height="500" fill="url(#grid)"/>
  
  <!-- Linhas decorativas -->
  <path d="M0 250 L1500 250" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <path d="M0 350 L1500 350" stroke="rgba(0,255,136,0.1)" stroke-width="1"/>
  
  <!-- Círculos decorativos -->
  <circle cx="1300" cy="100" r="150" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="2"/>
  <circle cx="1350" cy="120" r="100" fill="none" stroke="rgba(0,255,136,0.1)" stroke-width="2"/>
  
  <!-- Área da foto (círculo) - Lado direito -->
  <defs>
    <clipPath id="circleView">
      <circle cx="1250" cy="250" r="120"/>
    </clipPath>
  </defs>
  
  <!-- Placeholder para foto do usuário -->
  <circle cx="1250" cy="250" r="120" fill="#2a2a4a" stroke="url(#textGradient)" stroke-width="4" filter="url(#glow)"/>
  <text x="1250" y="240" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="18" font-weight="bold">SUA FOTO</text>
  <text x="1250" y="265" text-anchor="middle" fill="#888" font-family="Arial" font-size="14">400x400px</text>
  
  <!-- Conteúdo principal - Lado esquerdo -->
  <!-- Badge -->
  <rect x="80" y="60" width="180" height="30" rx="15" fill="rgba(0,212,255,0.2)" stroke="#00d4ff" stroke-width="1"/>
  <text x="170" y="81" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="14" font-weight="bold">🔥 OPEN SOURCE</text>
  
  <!-- Título principal -->
  <text x="80" y="150" fill="url(#textGradient)" font-family="Arial Black, Arial" font-size="52" font-weight="bold" filter="url(#glow)">
    WEB3 SECURITY
  </text>
  <text x="80" y="210" fill="#ffffff" font-family="Arial Black, Arial" font-size="52" font-weight="bold">
    AUTOMATION
  </text>
  
  <!-- Subtítulo -->
  <text x="80" y="260" fill="#aaa" font-family="Arial" font-size="22" font-style="italic">
    Framework Completo de Testes para DApps
  </text>
  
  <!-- Features -->
  <g transform="translate(80, 310)">
    <rect x="0" y="0" width="280" height="35" rx="5" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" fill="#00d4ff" font-family="Arial" font-size="16">🔗 Integração MetaMask</text>
  </g>
  
  <g transform="translate(370, 310)">
    <rect x="0" y="0" width="280" height="35" rx="5" fill="rgba(0,255,136,0.1)" stroke="rgba(0,255,136,0.3)" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" fill="#00ff88" font-family="Arial" font-size="16">🔒 Smart Contract Testing</text>
  </g>
  
  <g transform="translate(80, 355)">
    <rect x="0" y="0" width="280" height="35" rx="5" fill="rgba(255,193,7,0.1)" stroke="rgba(255,193,7,0.3)" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" fill="#ffc107" font-family="Arial" font-size="16">🐳 Docker &amp; CI/CD</text>
  </g>
  
  <g transform="translate(370, 355)">
    <rect x="0" y="0" width="280" height="35" rx="5" fill="rgba(156,39,176,0.1)" stroke="rgba(156,39,176,0.3)" stroke-width="1"/>
    <text x="140" y="24" text-anchor="middle" fill="#9c27b0" font-family="Arial" font-size="16">⚡ Playwright + TypeScript</text>
  </g>
  
  <!-- Nome do autor -->
  <text x="80" y="440" fill="#ffffff" font-family="Arial" font-size="20" font-weight="bold">
    Ricardo Silva
  </text>
  <text x="80" y="465" fill="#888" font-family="Arial" font-size="16">
    QA Automation Engineer | Blockchain Specialist
  </text>
  
  <!-- GitHub link -->
  <g transform="translate(80, 485)">
    <rect x="0" y="-20" width="400" height="25" rx="3" fill="none"/>
    <text x="0" y="0" fill="#00d4ff" font-family="Arial" font-size="14">
      github.com/Mendes1982/web3-security-automation
    </text>
  </g>
  
  <!-- Ícones de tech no canto -->
  <g transform="translate(1350, 420)">
    <!-- Ethereum icon placeholder -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffd700" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffd700" font-size="12">⬡</text>
    
    <circle cx="50" cy="0" r="20" fill="none" stroke="#45ba4b" stroke-width="2"/>
    <text x="50" y="5" text-anchor="middle" fill="#45ba4b" font-size="12">▶</text>
    
    <circle cx="100" cy="0" r="20" fill="none" stroke="#e2761b" stroke-width="2"/>
    <text x="100" y="5" text-anchor="middle" fill="#e2761b" font-size="12">🦊</text>
  </g>
  
  <!-- Badges no canto superior direito -->
  <g transform="translate(1150, 30)">
    <rect x="0" y="0" width="90" height="25" rx="3" fill="#45ba4b"/>
    <text x="45" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Playwright</text>
  </g>
  
  <g transform="translate(1250, 30)">
    <rect x="0" y="0" width="90" height="25" rx="3" fill="#3178c6"/>
    <text x="45" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">TypeScript</text>
  </g>
  
  <g transform="translate(1350, 30)">
    <rect x="0" y="0" width="90" height="25" rx="3" fill="#3c3c3d"/>
    <text x="45" y="17" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Ethereum</text>
  </g>
</svg>