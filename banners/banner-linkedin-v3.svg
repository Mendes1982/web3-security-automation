<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffed4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa500;stop-opacity:1" />
    </linearGradient>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(255,215,0,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Fundo principal -->
  <rect width="1500" height="500" fill="url(#bgGradient3)"/>
  <rect width="1500" height="500" fill="url(#dots)"/>
  
  <!-- Círculos decorativos grandes -->
  <circle cx="750" cy="250" r="300" fill="none" stroke="rgba(255,215,0,0.05)" stroke-width="2"/>
  <circle cx="750" cy="250" r="250" fill="none" stroke="rgba(255,215,0,0.1)" stroke-width="1"/>
  
  <!-- Faixa diagonal -->
  <path d="M-100 500 L400 0 L500 0 L0 500 Z" fill="rgba(255,215,0,0.03)"/>
  <path d="M1000 500 L1500 0 L1600 0 L1100 500 Z" fill="rgba(255,215,0,0.03)"/>
  
  <!-- Conteúdo centralizado -->
  <g transform="translate(750, 250)">
    <!-- Título principal -->
    <text x="0" y="-80" text-anchor="middle" fill="url(#goldGradient)" font-family="Arial Black, Arial" font-size="56" font-weight="bold" filter="url(#neonGlow)">
      WEB3 SECURITY
    </text>
    <text x="0" y="-20" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial" font-size="56" font-weight="bold">
      AUTOMATION
    </text>
    
    <!-- Subtítulo -->
    <text x="0" y="25" text-anchor="middle" fill="#888" font-family="Arial" font-size="20">
      Framework Profissional de Testes para Blockchain
    </text>
    
    <!-- Separador -->
    <line x1="-200" y1="50" x2="200" y2="50" stroke="url(#goldGradient)" stroke-width="2" filter="url(#neonGlow)"/>
  </g>
  
  <!-- Foto do autor - Canto inferior esquerdo -->
  <g transform="translate(100, 280)">
    <!-- Fundo da foto -->
    <rect x="0" y="0" width="150" height="150" rx="75" fill="#2a2a4a" stroke="url(#goldGradient)" stroke-width="3" filter="url(#neonGlow)"/>
    
    <!-- Placeholder texto -->
    <text x="75" y="70" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="14" font-weight="bold">SUA</text>
    <text x="75" y="90" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="14" font-weight="bold">FOTO</text>
    <text x="75" y="115" text-anchor="middle" fill="#666" font-family="Arial" font-size="11">400x400</text>
    
    <!-- Nome ao lado da foto -->
    <text x="180" y="60" fill="#fff" font-family="Arial" font-size="24" font-weight="bold">Ricardo Silva</text>
    <text x="180" y="90" fill="#ffd700" font-family="Arial" font-size="14">QA Automation Engineer</text>
    <text x="180" y="115" fill="#888" font-family="Arial" font-size="13">Especialista em Blockchain &amp; Web3</text>
  </g>
  
  <!-- Features cards - Canto inferior direito -->
  <g transform="translate(950, 280)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
      <text x="100" y="30" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="28">🔗</text>
      <text x="100" y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">MetaMask</text>
      <text x="100" y="72" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">Integração Nativa</text>
    </g>
    
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
      <text x="100" y="30" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="28">🛡️</text>
      <text x="100" y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">Segurança</text>
      <text x="100" y="72" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">Smart Contracts</text>
    </g>
    
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
      <text x="100" y="30" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="28">⚡</text>
      <text x="100" y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">Playwright</text>
      <text x="100" y="72" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">Testes E2E</text>
    </g>
    
    <g transform="translate(220, 95)">
      <rect x="0" y="0" width="200" height="80" rx="10" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.3)" stroke-width="2"/>
      <text x="100" y="30" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="28">🐳</text>
      <text x="100" y="55" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">Docker</text>
      <text x="100" y="72" text-anchor="middle" fill="#888" font-family="Arial" font-size="10">CI/CD Ready</text>
    </g>
  </g>
  
  <!-- GitHub link na parte inferior central -->
  <g transform="translate(750, 460)">
    <rect x="-250" y="-15" width="500" height="35" rx="17" fill="rgba(255,215,0,0.1)" stroke="rgba(255,215,0,0.3)" stroke-width="1"/>
    <text x="0" y="8" text-anchor="middle" fill="#ffd700" font-family="Arial" font-size="15">
      ⭐ github.com/Mendes1982/web3-security-automation
    </text>
  </g>
  
  <!-- Badges no topo -->
  <g transform="translate(750, 40)">
    <g transform="translate(-200, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#45ba4b"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Playwright</text>
    </g>
    <g transform="translate(-65, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#3178c6"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">TypeScript</text>
    </g>
    <g transform="translate(70, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#3c3c3d"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">Ethereum</text>
    </g>
    <g transform="translate(205, 0)">
      <rect x="-50" y="-12" width="100" height="24" rx="12" fill="#e2761b"/>
      <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="11" font-weight="bold">MetaMask</text>
    </g>
  </g>
  
  <!-- Elementos decorativos nos cantos -->
  <g opacity="0.3">
    <text x="30" y="50" fill="#ffd700" font-family="monospace" font-size="20">&lt;/&gt;</text>
    <text x="1440" y="50" fill="#ffd700" font-family="monospace" font-size="20">{ }</text>
    <text x="30" y="470" fill="#ffd700" font-family="monospace" font-size="20">#</text>
    <text x="1440" y="470" fill="#ffd700" font-family="monospace" font-size="20">//</text>
  </g>
  
  <!-- Linha de destaque -->
  <line x1="100" y1="250" x2="300" y2="250" stroke="url(#goldGradient)" stroke-width="3" filter="url(#neonGlow)"/>
  <line x1="1200" y1="250" x2="1400" y2="250" stroke="url(#goldGradient)" stroke-width="3" filter="url(#neonGlow)"/>
</svg>